name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: ./mvnw clean install -DskipTests

    - name: Run Backend Tests
      run: ./mvnw test

    - name: Build Docker image
      run: docker build -t suara-rakyat-backend .

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag and Push Docker image
      run: |
        docker tag suara-rakyat-backend:latest ${{ secrets.DOCKER_USERNAME }}/suara-rakyat-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/suara-rakyat-backend:latest
