name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'FE/client/**'
  pull_request:
    branches:
      - main
    paths:
      - 'FE/client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FE/client

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'FE/client/package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Run Frontend Tests
      run: npm test -- --watchAll=false

    - name: Build React app
      run: npm run build

    - name: Build Docker image
      run: docker build -t suara-rakyat-frontend .

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag and Push Docker image
      run: |
        docker tag suara-rakyat-frontend:latest ${{ secrets.DOCKER_USERNAME }}/suara-rakyat-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/suara-rakyat-frontend:latest
