# Production Database Configuration (use environment variables for sensitive data)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# In production, ddl-auto should be 'none' or 'validate' and schema migrations handled by tools like Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false # Disable showing SQL in production
server.port=8080

# JWT Properties for Production (use environment variables for sensitive data)
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=${JWT_EXPIRATION_MS:86400000} # Default to 24 hours if not set
